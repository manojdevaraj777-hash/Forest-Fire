services:
  - type: web
    name: forest-fire
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/app.py"
    runtimePython: "3.12.3"
    instanceType: "standard"
    plan: "free"
    autoDeploy: true
    trunkBranch: main
    buildTimeout: 120