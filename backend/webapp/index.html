<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Guard | Environmental Monitoring</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --glass-bg: rgba(20, 28, 22, 0.55);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-header: rgba(15, 20, 16, 0.85);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #34d399;
            --accent-amber: #fbbf24;
            --accent-red: #ef4444;
        }

        body {
            /* Realistic forest background */
            background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Ambient dark overlay to ensure text contrast */
        .ambient-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(10,15,10,0.7) 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Glass Panel Class */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .glass-header {
            background: var(--glass-header);
            border-bottom: 1px solid var(--glass-border);
        }

        /* Custom Scrollbar for Terminal */
        .terminal-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .terminal-scroll::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2); 
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 4px;
        }
        .terminal-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4); 
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Progress Bar Base */
        .metric-bar {
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
            margin-top: 1.5rem;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .metric-fill {
            height: 100%;
            background: var(--text-muted);
            width: 0%;
            transition: width 0.5s ease, background-color 0.5s ease;
        }

        /* Layout Utilities */
        .layout-container {
            max-w-[1400px];
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Background Darkening Overlay -->
    <div class="ambient-overlay"></div>

    <nav class="glass-panel sticky top-0 z-50 border-b border-white/10 layout-container rounded-b-2xl mx-4 xl:mx-auto mt-0 xl:mt-4">
        <div class="px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Logo Area -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-green-400/80 to-emerald-700/80 flex items-center justify-center border border-white/20 shadow-lg">
                    <i data-lucide="triangle" class="text-white w-6 h-6 fill-white/20"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-white leading-tight">Forest Guard</h1>
                    <p class="text-[10px] uppercase tracking-widest text-emerald-300 font-medium">Save Our Forest</p>
                </div>
            </div>

            <!-- Main Navigation Tabs -->
            <div class="hidden md:flex items-center space-x-1 bg-black/30 p-1.5 rounded-xl border border-white/5">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg bg-white/10 text-white text-sm font-medium shadow-sm transition-all flex items-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i> Home
                </button>
                <button onclick="showModal('Trends', 'line-chart', 'Detailed historical trends and charts will be available in the next update.')" class="px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 text-sm font-medium transition-all flex items-center gap-2">
                    <i data-lucide="line-chart" class="w-4 h-4"></i> Trends
                </button>
                <button onclick="showModal('Alerts', 'bell', 'Alert history log will be available in the next update.')" class="px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 text-sm font-medium transition-all flex items-center gap-2 relative">
                    <i data-lucide="bell" class="w-4 h-4"></i> Alerts
                    <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-black animate-pulse"></span>
                </button>
                <button onclick="loadActionPlan()" class="px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 text-sm font-medium transition-all flex items-center gap-2">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i> Action Plan
                </button>
                <button onclick="showModal('Hardware', 'server', 'Connected Device: NodeMCU ESP8266\nStatus: Online\nSensors: DHT11, MQ-2, IR Flame')" class="px-4 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/5 text-sm font-medium transition-all flex items-center gap-2">
                    <i data-lucide="server" class="w-4 h-4"></i> Hardware
                </button>
            </div>

            <!-- Status Indicator -->
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/40 border border-white/10">
                <div class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
                </div>
                <span class="text-xs font-semibold text-slate-200 tracking-wide">Monitoring</span>
            </div>
        </div>
    </nav>

    <main class="layout-container px-4 xl:px-0 py-8 flex flex-col gap-8">
        
        <section class="glass-panel rounded-2xl overflow-hidden fade-in-up" style="animation-delay: 0.1s;">
            <!-- MacOS style window header -->
            <div class="glass-header px-4 py-3 flex items-center gap-4">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/80 border border-red-500/50 shadow-inner"></div>
                    <div class="w-3 h-3 rounded-full bg-amber-500/80 border border-amber-500/50 shadow-inner"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/80 border border-green-500/50 shadow-inner"></div>
                </div>
                <span class="text-xs text-slate-400 font-mono tracking-wider">Serial Monitor – NodeMCU / ttyUSB0</span>
            </div>
            
            <!-- Terminal Output -->
            <div id="serial-output" class="p-5 h-48 overflow-y-auto terminal-scroll font-mono text-sm space-y-1.5 bg-black/20">
            </div>
        </section>

        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            
            <!-- Real-Time Temperature Chart -->
            <div class="glass-panel rounded-2xl p-4 relative overflow-hidden fade-in-up group lg:col-span-2 md:col-span-2 flex flex-col" style="animation-delay: 0.2s;">
                <div class="flex justify-between items-start mb-2">
                    <div class="flex flex-col">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Temperature Trend</h3>
                        <div class="flex items-end gap-2 mt-1">
                            <span id="val-temp-current" class="text-3xl font-light tracking-tighter text-white">--</span>
                            <span class="text-lg text-slate-400 font-medium mb-0.5">°C</span>
                        </div>
                    </div>
                    <div class="p-2 rounded-lg bg-orange-500/20 border border-orange-500/30">
                        <i data-lucide="activity" class="text-orange-400 w-5 h-5"></i>
                    </div>
                </div>
                <div class="flex-grow w-full h-28 relative mt-2">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>

            <!-- Humidity Card -->
            <div class="glass-panel rounded-2xl p-4 relative overflow-hidden fade-in-up group hover:bg-white/5 transition-colors duration-300" style="animation-delay: 0.3s;">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Humidity</h3>
                    <div class="p-2 rounded-lg bg-blue-500/20 border border-blue-500/30">
                        <i data-lucide="droplets" class="text-blue-400 w-5 h-5"></i>
                    </div>
                </div>
                <div class="flex items-end gap-2">
                    <span id="val-hum" class="text-4xl font-light tracking-tighter text-white">--</span>
                    <span class="text-lg text-slate-400 font-medium mb-1">%</span>
                </div>
                <div class="metric-bar">
                    <div id="bar-hum" class="metric-fill bg-blue-400" style="width: 0%;"></div>
                </div>
            </div>

            <!-- Smoke ADC Card -->
            <div class="glass-panel rounded-2xl p-4 relative overflow-hidden fade-in-up group hover:bg-white/5 transition-colors duration-300" style="animation-delay: 0.4s;">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Smoke ADC</h3>
                    <div class="p-2 rounded-lg bg-slate-500/20 border border-slate-500/30">
                        <i data-lucide="wind" class="text-slate-300 w-5 h-5"></i>
                    </div>
                </div>
                <div class="flex items-end gap-2">
                    <span id="val-smoke" class="text-4xl font-light tracking-tighter text-white">--</span>
                    <span class="text-lg text-slate-400 font-medium mb-1">/1024</span>
                </div>
                <div class="metric-bar">
                    <div id="bar-smoke" class="metric-fill bg-slate-400" style="width: 0%;"></div>
                </div>
            </div>

            <!-- IR Flame Card -->
            <div class="glass-panel rounded-2xl p-4 relative overflow-hidden fade-in-up group hover:bg-white/5 transition-colors duration-300" style="animation-delay: 0.6s;">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">IR Flame Sensor</h3>
                    <div class="p-2 rounded-lg bg-red-500/20 border border-red-500/30 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                        <i data-lucide="flame" class="text-red-400 w-5 h-5"></i>
                    </div>
                </div>
                <div class="flex items-center h-[38px]">
                    <div class="flex items-center gap-3">
                        <div id="val-flame-dot" class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                        <span id="val-flame-text" class="text-xl font-medium tracking-tight text-emerald-400">NORMAL</span>
                    </div>
                </div>
                <div class="metric-bar opacity-50 mt-4">
                    <div id="bar-flame" class="metric-fill bg-emerald-500" style="width: 100%;"></div>
                </div>
            </div>

            <!-- WiFi Signal Card -->
            <div class="glass-panel rounded-2xl p-4 relative overflow-hidden fade-in-up group hover:bg-white/5 transition-colors duration-300" style="animation-delay: 0.7s;">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest">WiFi Signal (RSSI)</h3>
                    <div class="p-2 rounded-lg bg-emerald-500/20 border border-emerald-500/30">
                        <i data-lucide="wifi" class="text-emerald-400 w-5 h-5"></i>
                    </div>
                </div>
                <div class="flex items-end gap-2">
                    <span id="val-wifi" class="text-4xl font-light tracking-tighter text-white">--</span>
                    <span class="text-lg text-slate-400 font-medium mb-1">dBm</span>
                </div>
                <div class="metric-bar">
                    <div id="bar-wifi" class="metric-fill bg-emerald-400" style="width: 0%;"></div>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal Overlay -->
    <div id="feature-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 relative z-10 fade-in-up">
            <h2 id="modal-title" class="text-xl font-bold mb-4 flex items-center gap-2 text-white">Title</h2>
            <div id="modal-content" class="text-sm text-slate-300 space-y-3 whitespace-pre-wrap leading-relaxed">Content...</div>
            <button onclick="closeModal()" class="mt-6 px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-lg w-full transition-colors font-medium">Close</button>
        </div>
    </div>

    <script src="app.js?v=6"></script>
    <script>
        function showModal(title, icon, content) {
            document.getElementById('modal-title').innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i> ${title}`;
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('feature-modal').classList.remove('hidden');
            lucide.createIcons();
        }
        function closeModal() {
            document.getElementById('feature-modal').classList.add('hidden');
        }
        async function loadActionPlan() {
            showModal('Action Plan', 'clipboard-list', 'Loading action plan...');
            try {
                let res = await fetch('/api/action/suggest');
                let data = await res.json();
                showModal('Action Plan', 'clipboard-list', data.analysis || 'No data available.');
            } catch (e) {
                showModal('Action Plan', 'clipboard-list', 'Error loading plan.');
            }
        }
    </script>
</body>
</html>
