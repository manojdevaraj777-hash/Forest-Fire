<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forest Fire Detection — Web App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <div class="header-left">
            <span class="logo">&#128276;</span>
            <h1>Forest Fire Detection</h1>
        </div>
        <div class="header-right">
            <span class="live-dot" id="live-dot"></span>
            <span id="status-text">Loading...</span>
        </div>
    </header>

    <main>
        <section class="cards">
            <div class="card" id="card-temp">
                <div class="card-label">Temperature</div>
                <div class="card-value" id="val-temp">—</div>
                <div class="card-unit">°C</div>
                <div class="card-status" id="status-temp">—</div>
            </div>
            <div class="card" id="card-hum">
                <div class="card-label">Humidity</div>
                <div class="card-value" id="val-hum">—</div>
                <div class="card-unit">%</div>
                <div class="card-status" id="status-hum">—</div>
            </div>
            <div class="card" id="card-smoke">
                <div class="card-label">Smoke ADC</div>
                <div class="card-value" id="val-smoke">—</div>
                <div class="card-unit">/1024</div>
                <div class="card-status" id="status-smoke">—</div>
            </div>
            <div class="card" id="card-flame">
                <div class="card-label">Flame</div>
                <div class="card-value" id="val-flame">—</div>
                <div class="card-unit">—</div>
                <div class="card-status" id="status-flame">—</div>
            </div>
        </section>

        <section class="charts">
            <div class="chart-box">
                <h3>Temperature &amp; Humidity</h3>
                <canvas id="chart-temp-hum"></canvas>
            </div>
            <div class="chart-box">
                <h3>Smoke ADC</h3>
                <canvas id="chart-smoke"></canvas>
            </div>
        </section>

        <section class="ai-section">
            <button class="ai-btn" id="ai-toggle">🤖 AI Assistant</button>
            <div class="ai-panel" id="ai-panel">
                <div class="ai-header">
                    <h3>AI Analysis</h3>
                    <button id="ai-close">&times;</button>
                </div>
                <div class="ai-body" id="ai-body">
                    <p class="ai-hint">Click "Analyze" to get AI insights on current readings.</p>
                    <button class="ai-analyze-btn" id="ai-analyze">Analyze Current Data</button>
                    <div class="ai-result" id="ai-result"></div>
                </div>
            </div>
        </section>

        <section class="history">
            <h3>Alert History</h3>
            <table id="alert-table">
                <thead>
                    <tr><th>Time</th><th>Type</th><th>Temp °C</th><th>Hum %</th><th>Smoke</th></tr>
                </thead>
                <tbody id="alert-tbody">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
