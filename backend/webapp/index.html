<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forest Fire Detection</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>&#128276; Forest Fire Detection</h1>
        <span class="live-dot" id="live-dot"></span>
        <span id="status-text">Loading...</span>
    </header>

    <main>
        <!-- LIVE SENSORS -->
        <section>
            <h2>Live Sensors</h2>
            <div class="cards">
                <div class="card">
                    <div class="card-label">Temperature</div>
                    <div class="card-value" id="val-temp">—</div>
                    <div class="card-unit">°C</div>
                    <div class="card-status" id="st-temp">—</div>
                </div>
                <div class="card">
                    <div class="card-label">Humidity</div>
                    <div class="card-value" id="val-hum">—</div>
                    <div class="card-unit">%</div>
                    <div class="card-status" id="st-hum">—</div>
                </div>
                <div class="card">
                    <div class="card-label">Smoke ADC</div>
                    <div class="card-value" id="val-smoke">—</div>
                    <div class="card-unit">/1024</div>
                    <div class="card-status" id="st-smoke">—</div>
                </div>
                <div class="card">
                    <div class="card-label">Heat Index</div>
                    <div class="card-value" id="val-heat">—</div>
                    <div class="card-unit">°C</div>
                    <div class="card-status" id="st-heat">—</div>
                </div>
                <div class="card">
                    <div class="card-label">Flame</div>
                    <div class="card-value" id="val-flame">—</div>
                    <div class="card-unit">—</div>
                    <div class="card-status" id="st-flame">—</div>
                </div>
                <div class="card">
                    <div class="card-label">WiFi</div>
                    <div class="card-value" id="val-rssi">—</div>
                    <div class="card-unit">dBm</div>
                    <div class="card-status" id="st-rssi">—</div>
                </div>
            </div>
        </section>

        <!-- CHARTS -->
        <section class="charts">
            <div class="chart-box"><h3>Temp & Humidity</h3><canvas id="chart-temp-hum"></canvas></div>
            <div class="chart-box"><h3>Smoke ADC</h3><canvas id="chart-smoke"></canvas></div>
        </section>

        <!-- AI ASSISTANT -->
        <section class="ai-section">
            <button class="ai-btn" id="ai-toggle">🤖 AI Assistant</button>
            <div class="ai-panel" id="ai-panel">
                <div class="ai-header">
                    <h3>AI Analysis</h3>
                    <button id="ai-close">&times;</button>
                </div>
                <button class="ai-analyze-btn" id="ai-analyze">Analyze Current Data</button>
                <div class="ai-result" id="ai-result"></div>
            </div>
        </section>

        <!-- ALERT HISTORY -->
        <section>
            <h2>Alerts</h2>
            <table id="alert-table">
                <thead>
                    <tr><th>Time</th><th>Type</th><th>Temp</th><th>Hum</th><th>Smoke</th></tr>
                </thead>
                <tbody id="alert-tbody">
                    <tr><td colspan="5">No alerts yet</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
